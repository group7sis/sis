<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="center-page">
  <div class="card">
    <h1>Admin Login</h1>
    <p>Use admin username and password from the database.</p>
    <div id="msg" class="msg hidden"></div>
    <form id="form">
      <label>Username</label>
      <input id="username" required>
      <label>Password</label>
      <input id="password" type="password" required>
      <button class="btn" type="submit">Login</button>
    </form>
    <p style="margin-top:1rem;font-size:0.85rem"><a href="index.html">Back</a></p>
  </div>
  <script src="js/api.js"></script>
  <script>
    document.getElementById('form').addEventListener('submit', async e => {
      e.preventDefault();
      const msg = document.getElementById('msg');
      hideMsg(msg);
      try {
        const res = await api('/auth/admin/login', {
          method: 'POST',
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value
          })
        });
        if (!res.success) throw new Error(res.message);
        saveSession({ role: 'ADMIN', id: res.id, name: res.name });
        location.href = 'admin.html';
      } catch (err) {
        showMsg(msg, err.message, 'err');
      }
    });
  </script>
</body>
</html>
