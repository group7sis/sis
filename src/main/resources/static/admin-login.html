<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - SIS</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="center-page">
  <div class="card wide">
    <div class="card-side">
      <img src="assets/placeholder/Placeholder.png" alt="SIS Logo">
      <h1>Philippine State University</h1>
    </div>
    <div class="card-form">
      <h2>Admin Portal</h2>
      <p class="subtitle">Sign in to your admin account</p>
      <div id="msg" class="msg hidden"></div>
      <form id="form">
        <label>Username</label>
        <input id="username" placeholder="Enter your username" required>
        <label>Password</label>
        <input id="password" type="password" placeholder="Enter your password" required>
        <button class="btn" type="submit">Sign In</button>
      </form>
      <p style="margin-top:1rem;font-size:0.82rem;text-align:center"><a href="index.html">Back to Home</a></p>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script>
    document.getElementById('form').addEventListener('submit', async e => {
      e.preventDefault();
      const msg = document.getElementById('msg');
      hideMsg(msg);
      try {
        const res = await api('/auth/admin/login', {
          method: 'POST',
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value
          })
        });
        if (!res.success) throw new Error(res.message);
        saveSession({ role: 'ADMIN', id: res.id, name: res.name });
        location.href = 'admin.html';
      } catch (err) {
        showMsg(msg, err.message, 'err');
      }
    });
  </script>
</body>
</html>
