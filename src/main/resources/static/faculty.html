<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faculty Portal</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <h2 id="userLabel">Faculty</h2>
      <button data-panel="dashboard" class="active">Dashboard</button>
      <button data-panel="schedules">Schedules</button>
      <button data-panel="classes">Class List</button>
      <button data-panel="grades">Encode Grades</button>
      <button data-panel="formula">Grade Formula</button>
      <button data-panel="profile">Profile</button>
      <a href="#" class="logout">Logout</a>
    </aside>
    <main class="main">
      <div id="msg" class="msg hidden"></div>

      <section id="panel-dashboard" class="panel active">
        <h1>Dashboard</h1>
        <div id="dashContent"></div>
      </section>

      <section id="panel-schedules" class="panel">
        <h1>Weekly Schedules</h1>
        <div id="schedContent"></div>
      </section>

      <section id="panel-classes" class="panel">
        <h1>Class List</h1>
        <div class="row">
          <div style="flex:1;min-width:140px"><label>Course</label><select id="classCourseId"><option value="">Select course</option></select></div>
          <div style="flex:1;min-width:140px"><label>Section</label><select id="classSectionId"><option value="">Select section</option></select></div>
          <div style="flex:1;min-width:140px"><label>Name filter</label><input id="className"></div>
          <div style="align-self:end"><button class="btn btn-sm" id="classLoadBtn">Load</button></div>
        </div>
        <div id="classTable"></div>
      </section>

      <section id="panel-grades" class="panel">
        <h1>Encode Grades</h1>
        <div id="gradeTermNotice" class="hidden"></div>
        <div id="gradeControls">
          <div class="row">
            <div style="flex:1"><label>Course</label><select id="gradeCourse"></select></div>
            <div style="flex:1"><label>Section</label><select id="gradeSection"></select></div>
            <div style="align-self:end"><button class="btn btn-sm" id="gradeLoadBtn">Load Students</button></div>
          </div>
        </div>
        <div id="gradeStudentTable"></div>
        <div id="gradeFormWrap" class="hidden" style="margin-top:0.75rem">
          <h2 style="font-size:1rem;margin-bottom:0.5rem" id="gradeStudentLabel"></h2>
          <form id="gradeForm" class="grid-2">
            <div><label>Assignments (0-100)</label><input name="assignments" type="number" min="0" max="100"></div>
            <div><label>Quizzes (0-100)</label><input name="quizzes" type="number" min="0" max="100"></div>
            <div><label>Activities (0-100)</label><input name="activities" type="number" min="0" max="100"></div>
            <div><label>Final Exam (0-100)</label><input name="finalExam" type="number" min="0" max="100"></div>
            <div><label>Calculated Grade</label><input name="calculatedGrade" disabled></div>
            <div><label>Final Grade</label><input name="finalGrade" type="number" step="0.01" min="1" max="5"></div>
            <div style="grid-column:1/-1" class="row">
              <button class="btn btn-sm" type="button" id="computeBtn">Compute</button>
              <button class="btn btn-sm" type="submit">Save</button>
            </div>
          </form>
        </div>
      </section>

      <section id="panel-formula" class="panel">
        <h1>Grade Formula Weights</h1>
        <form id="formulaForm" class="grid-2">
          <div><label>Assignments %</label><input name="assignmentWeight" type="number" required></div>
          <div><label>Quizzes %</label><input name="quizWeight" type="number" required></div>
          <div><label>Activities %</label><input name="activityWeight" type="number" required></div>
          <div><label>Final Exam %</label><input name="finalExamWeight" type="number" required></div>
          <div style="grid-column:1/-1"><button class="btn btn-sm" type="submit">Save Formula</button></div>
        </form>
      </section>

      <section id="panel-profile" class="panel">
        <h1>Profile</h1>
        <form id="profileForm" class="grid-2">
          <div><label>First Name</label><input name="firstName" required></div>
          <div><label>Middle Name</label><input name="middleName"></div>
          <div><label>Last Name</label><input name="lastName" required></div>
          <div><label>Suffix</label><input name="suffix"></div>
          <div><label>Mobile</label><input name="mobileNumber"></div>
          <div><label>Department</label><input name="departmentName" disabled></div>
          <div><label>Position</label><input name="position" disabled></div>
          <div style="grid-column:1/-1"><button class="btn btn-sm" type="submit">Save Profile</button></div>
        </form>
      </section>
    </main>
  </div>
  <script src="js/api.js"></script>
  <script src="js/faculty.js"></script>
</body>
</html>
